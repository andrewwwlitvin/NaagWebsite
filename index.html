<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naag</title>
  <meta name="description" content="naag — a multidisciplinary creative union working in interdimensional business areas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #ffffff;
    }

    body {
      font-family: 'Darker Grotesque', sans-serif;
      font-weight: 400;
      color: #333333;
      font-size: clamp(25px, calc(20px + 1.6vw), 54px);
      -webkit-text-size-adjust: 100%;
      line-height: 0.85;
      padding: clamp(24px, 2.8vw, 56px) clamp(20px, 2.3vw, 46px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Custom naag cursor on interactive states */
    a, a:hover, a:active, button, [onclick] {
      cursor: url('cursor.png') 32 15, pointer;
    }

    .gap {
      display: inline-block;
      width: 0.9em;
    }

    /* Mascot: phones/tablets — bottom center, thumb-sized */
    .mascot {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: min(96px, 22vw);
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    main {
      padding-bottom: 120px;
    }

    /* Mascot: bigger screens — bottom right, tucked 15% beyond the right
       and bottom screen edges, ~20% of page area (image aspect ≈ 1.26) */
    @media (min-width: 1025px) {
      .mascot {
        left: auto;
        right: 0;
        bottom: 0;
        transform: translate(15%, 15%);
        width: min(38vw, 94vh);
      }

      main {
        padding-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <p>naag [ half human / half divine]<span class="gap"></span><a href="mailto:hey@naag.studio">hey@naag.studio</a>.</p>
    <p>a multidisciplinary creative union working in interdimensional business areas.</p>
    <p>accents: creative communication services. art direction. marketing and business development support.</p>
    <p>we co-create. we grow. we prosper.</p>
    <p>&copy; on journey since 2023.</p>
  </main>
  <img class="mascot" src="mascot.png" alt="naag mascot — a cobra wearing sunglasses" onerror="this.style.display='none'">
</body>
</html>
